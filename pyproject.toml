[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "go-sensei"
version = "0.6.4"
description = "Plateau d'analyse KataGo et professeur IA pour apprendre le Go"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
# Professeur IA via l'API Anthropic (les autres fournisseurs n'ont besoin de rien)
anthropic = ["anthropic"]
# Icône dans la zone de notification (StatusNotifierItem via D-Bus)
tray = ["dbus-fast"]

[project.scripts]
go-sensei = "gosensei.__main__:main"

[tool.setuptools]
packages = ["gosensei", "gosensei.static", "gosensei.resources"]

[tool.setuptools.package-data]
gosensei = ["static/*", "resources/*"]
